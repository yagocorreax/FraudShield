[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudshield"
version = "0.1.0"
description = "POC local de detecção de fraudes orientada a eventos."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.5",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[project.scripts]
fraudshield-prepare = "fraudshield_prepare:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "fraudshield_contracts",
    "fraudshield_events",
    "fraudshield_pipeline",
    "fraudshield_prepare",
    "fraudshield_report",
    "fraudshield_settings",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

